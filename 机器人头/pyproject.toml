[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orin-voice-lab"
version = "0.1.0"
description = "Local-only Chinese voice dialogue A/B prototype for Jetson Orin NX"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.12,<2",
  "sherpa-onnx==1.13.8",
  "soundfile>=0.13,<0.14",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.5,<0.6"]
robot = ["opencv-python-headless>=4.8,<4.12", "pyserial>=3.5,<4"]

[project.scripts]
orin-voice = "orin_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orin_voice = ["static/*"]
