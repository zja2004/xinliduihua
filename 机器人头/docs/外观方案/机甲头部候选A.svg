<path d="M44 553h1032" stroke="#b9cbce"/>
<text x="48" y="590" class="label">装配前核对</text>
<text x="48" y="623" class="small">镜头　以实物安装坐标校正镜头窗，核对四角视野。</text>
<text x="48" y="653" class="small">眼与嘴　人工测量全行程包络，留出运动和维护空间。</text>
<text x="585" y="623" class="small">后盖　锁止、出线和工具可达性需样机核对。</text>
<text x="585" y="653" class="small">底部　实测颈部、底座和线束扫掠后再定开口。</text>
<text x="48" y="693" class="small mute">工程确认后填写同目录《外观评审与样机验收》并附实测记录。</text>
